# Local Canton ledger with PostgreSQL storage, so contracts, parties and the
# participant identity survive restarts. Started by `bun run ledger`.
# Ports match the built-in sandbox: JSON Ledger API 6864, gRPC 6865.
# Databases canton_participant, canton_sequencer, canton_sequencer_blocks and
# canton_mediator must exist
# (scripts/ledger.sh creates them).

_pg {
  dataSourceClass = "org.postgresql.ds.PGSimpleDataSource"
  properties {
    serverName = "127.0.0.1"
    serverName = ${?CANTON_DB_HOST}
    portNumber = "5432"
    portNumber = ${?CANTON_DB_PORT}
    user = "postgres"
    user = ${?CANTON_DB_USER}
    password = "postgres"
    password = ${?CANTON_DB_PASSWORD}
  }
}

canton {
  participants.sandbox {
    admin-api.port = 6866
    http-ledger-api.port = 6864
    ledger-api {
      port = 6865
      user-management-service.enabled = true
    }
    storage {
      type = postgres
      config = ${_pg} { properties.databaseName = "canton_participant" }
    }
  }
  sequencers.sequencer1 {
    admin-api.port = 6868
    public-api.port = 6867
    sequencer {
      type = reference
      config.storage {
        type = postgres
        config = ${_pg} { properties.databaseName = "canton_sequencer_blocks" }
      }
    }
    storage {
      type = postgres
      config = ${_pg} { properties.databaseName = "canton_sequencer" }
    }
  }
  mediators.mediator1 {
    admin-api.port = 6869
    storage {
      type = postgres
      config = ${_pg} { properties.databaseName = "canton_mediator" }
    }
  }
}
